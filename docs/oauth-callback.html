<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carousel Bot — TikTok Connected</title>
  <link rel="icon" type="image/png" href="carousel_bot_icon_1024.png">
<style>
  body {
    margin: 0;
    background: #0f1115;
    color: #eef1f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    max-width: 560px;
    width: 100%;
    background: #171a21;
    border: 1px solid #262b36;
    border-radius: 12px;
    padding: 28px;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { color: #9aa4b2; font-size: 14px; line-height: 1.6; }
  .code-box {
    background: #10131a;
    border: 1px solid #262b36;
    border-radius: 8px;
    padding: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    word-break: break-all;
    margin: 14px 0;
    color: #25f4ee;
  }
  .error { color: #ff6b8a; }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    color: #0f1115;
    background: linear-gradient(90deg, #25f4ee, #fe2c55);
  }
  a { color: #25f4ee; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Processing…</h1>
  <p id="desc"></p>
  <div id="codeBox" style="display:none;" class="code-box"></div>
  <button id="copyBtn" style="display:none;">Copy code</button>
  <p><a href="admin.html">← Back to Admin</a></p>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const code = params.get("code");
const error = params.get("error");
const errorDesc = params.get("error_description");

const title = document.getElementById("title");
const desc = document.getElementById("desc");
const codeBox = document.getElementById("codeBox");
const copyBtn = document.getElementById("copyBtn");

if (code) {
  title.textContent = "TikTok account authorized";
  desc.textContent = "Copy this authorization code and exchange it for an access token (this step uses the app's client secret, so it's done via a short local script rather than in the browser).";
  codeBox.textContent = code;
  codeBox.style.display = "block";
  copyBtn.style.display = "inline-block";
  copyBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(code);
    copyBtn.textContent = "Copied!";
  });
} else if (error) {
  title.textContent = "Authorization failed";
  title.classList.add("error");
  desc.textContent = (errorDesc || error);
} else {
  title.textContent = "No authorization code received";
  desc.textContent = "This page expects to be reached via TikTok's OAuth redirect.";
}
</script>
</body>
</html>
