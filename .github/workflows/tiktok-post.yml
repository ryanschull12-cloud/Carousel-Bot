name: TikTok Post

# Posts carousel 1 to TikTok (photo mode, Direct Post) using content
# already generated and committed by the morning "Daily Carousels"
# workflow -- no new content is generated here.
#
# While the TikTok app is unaudited, posts land as private ("Only me") on
# the connected account -- see tiktok_post.py's docstring for how to
# switch that to public once the Content Posting API audit is approved.
#
# Runs every 15 minutes across an 8:00-11:45 AM UTC window instead of a
# single 8am/9am shot, for the same reason as daily.yml and
# posts_later.yml on the Instagram side: GitHub's scheduled-workflow queue
# for this repo has been observed to delay a single daily trigger by
# hours (checked 2026-08-04: the last 10 scheduled runs fired between
# 11:45 and 17:17 UTC, never at 8:00/9:00), or skip it entirely, and
# shifting which minute it's set to doesn't fix that. This workflow used
# to gate the actual post step on "is Irish local time == 9am right now?"
# which meant every one of those late-firing runs saw a false result and
# silently skipped posting -- nothing was ever failing, it just never
# tried. tiktok_post.py's own dedupe (tiktok_posted_log.json) makes every
# extra tick here a near-instant no-op once today's post has already gone
# out, so this just gives ~16 chances for one to get through instead of
# one all-or-nothing shot.

on:
  schedule:
    - cron: "*/15 8-11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # needed so this workflow can commit tiktok_posted_log.json

jobs:
  post-to-tiktok:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post carousel 1 to TikTok
        if: vars.TIKTOK_POSTING_PAUSED != 'true'
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python tiktok_post.py --only-index 1

      - name: Commit posted log
        if: vars.TIKTOK_POSTING_PAUSED != 'true'
        run: |
          git config user.name "carousel-bot"
          git config user.email "actions@github.com"
          git add tiktok_posted_log.json 2>/dev/null || true
          git commit -m "Log TikTok post $(date +'%Y-%m-%d %H:%M')" || echo "Nothing to commit"
          git push

      - name: Note that TikTok posting is paused
        if: vars.TIKTOK_POSTING_PAUSED == 'true'
        run: echo "TIKTOK_POSTING_PAUSED is set to true in repo variables — skipping TikTok auto-post."
