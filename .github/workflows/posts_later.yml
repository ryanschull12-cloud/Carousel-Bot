name: Midday Instagram Post

# Posts one of today's remaining auto-post-winning carousels using content
# already generated and committed by the morning "Daily Carousels"
# workflow — no new content is generated here.
#
# This used to hard-code "--only-index 3", assuming carousel 3 was always
# one of the auto-posted picks. That assumption broke once runner.py
# started picking the 3 auto-post winners by virality score instead of by
# fixed position (winners can now be any 3 of the 5 carousels). This
# workflow no longer cares which index it is — it just asks
# instagram_post.py for "whichever winning carousel from today hasn't
# posted yet", which instagram_post.py itself tracks via posted_log.json.
# That also makes this workflow naturally safe to run more than once (or
# late) without ever double-posting: if there's nothing left to post
# today, it just does nothing.

on:
  # DISABLED 2026-08-08 -- Instagram posting cut from 3/day to 1/day.
  # With a very small following, three posts a day split already-minimal
  # distribution across three carousels for a combined reach in the single
  # digits. evening-post.yml is now the only slot that posts to Instagram.
  # The whole schedule block below is commented out; workflow_dispatch stays
  # live so this can still be fired by hand from the Actions tab.
  # Re-enable by uncommenting the schedule block.
#  schedule:
#    # Runs every 15 minutes across a 1:00-4:45 PM GMT/UTC window instead of
#    # a single 1pm shot, for the same reason as daily.yml: GitHub's
#    # scheduled-workflow queue for this repo has been observed to delay a
#    # single daily trigger by hours, or skip it entirely, and shifting which
#    # minute it's set to doesn't fix that. instagram_post.py's own dedupe
#    # (posted_log.json / --target-count) makes every extra tick here a
#    # near-instant no-op once today's midday post has already gone out, so
#    # this just gives ~16 chances for one to get through near the intended
#    # time instead of one all-or-nothing shot.
#    # DISABLED 2026-08-08 -- cut to 1 Instagram post/day (evening only).
#    # Re-enable by uncommenting the line below.
#    # - cron: "*/15 13-16 * * *"
#    - cron: "0 5 31 2 *"   # never fires (Feb 31); keeps the schedule block valid
  workflow_dispatch: {}

permissions:
  contents: write   # needed so this workflow can commit posted_log.json

jobs:
  post-midday-carousel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post next Instagram carousel
        if: vars.IG_POSTING_PAUSED != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        # --target-count 2: by the end of the midday slot, exactly 2 of
        # today's winners should be posted in total (1 from the morning
        # slot + 1 here). This also protects against GitHub firing BOTH
        # the 12:30 and 13:30 UTC triggers for this workflow on a given
        # day -- the second firing sees 2 already posted and does
        # nothing, instead of posting a second, different carousel an
        # hour later.
        run: python instagram_post.py --target-count 2

      - name: Commit posting log
        if: vars.IG_POSTING_PAUSED != 'true'
        run: |
          git config user.name "carousel-bot"
          git config user.email "actions@github.com"
          git add posted_log.json 2>/dev/null || true
          git commit -m "Log Instagram post $(date +'%Y-%m-%d %H:%M')" || echo "Nothing to commit"
          git push

      - name: Note that Instagram posting is paused
        if: vars.IG_POSTING_PAUSED == 'true'
        run: echo "IG_POSTING_PAUSED is set to true in repo variables — skipping this scheduled post."
