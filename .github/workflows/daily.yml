name: Daily Carousels

on:
  schedule:
    # Fixed 7:30 AM GMT/UTC every day (not chasing Irish local clock time
    # across BST/GMT — this is a fixed UTC time year-round, per Ryan's
    # request). Note GitHub Actions schedules are best-effort, not
    # guaranteed to the minute — under load the platform can delay a
    # trigger by anywhere from a few minutes to (rarely) several hours.
    # The "already generated today?" check below still protects against
    # a delayed run causing a missed/duplicate day.
    - cron: "30 7 * * *"
  workflow_dispatch: {}   # lets you trigger it manually to test

permissions:
  contents: write   # needed so the workflow can commit today's images

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check whether today's batch was already generated
        id: check_time
        run: |
          python3 - <<'EOF'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          today = datetime.now(ZoneInfo("Europe/Dublin")).date().isoformat()
          already_generated = os.path.exists(f"posts/{today}/manifest.json")
          should_run = "true" if (event_name == "workflow_dispatch" or not already_generated) else "false"
          print(f"Irish date: {today} (trigger: {event_name}, already_generated={already_generated}) -> should_run={should_run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_run={should_run}\n")
          EOF

      - name: Set up Python
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.check_time.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Fetch real Instagram performance data
        if: steps.check_time.outputs.should_run == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python fetch_performance.py

      - name: Commit performance data
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          git config user.name "carousel-bot"
          git config user.email "actions@github.com"
          git add posted_log.json 2>/dev/null || true
          git add performance_history.json 2>/dev/null || true
          git commit -m "Update performance data $(date +'%Y-%m-%d')" || echo "Nothing to commit"
          git push

      - name: Generate carousels + send email
        if: steps.check_time.outputs.should_run == 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python runner.py

      - name: Commit and push today's images
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          git config user.name "carousel-bot"
          git config user.email "actions@github.com"
          git add posts/ history.json
          git commit -m "Add carousels for $(date +'%Y-%m-%d')" || echo "Nothing to commit"
          git push

      - name: Wait for raw URLs to propagate
        if: steps.check_time.outputs.should_run == 'true' && vars.IG_POSTING_PAUSED != 'true'
        run: sleep 15

      - name: Post next Instagram carousel
        if: steps.check_time.outputs.should_run == 'true' && vars.IG_POSTING_PAUSED != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        # --target-count 1: by the end of the morning slot, exactly 1 of
        # today's winners should be posted. This also protects against
        # GitHub firing BOTH the 7:30 and 8:30 UTC triggers for this same
        # workflow on a given day -- the second firing sees 1 already
        # posted and does nothing, instead of posting a second, different
        # carousel an hour later.
        run: python instagram_post.py --target-count 1

      - name: Commit posting log
        if: steps.check_time.outputs.should_run == 'true' && vars.IG_POSTING_PAUSED != 'true'
        run: |
          git config user.name "carousel-bot"
          git config user.email "actions@github.com"
          git add posted_log.json 2>/dev/null || true
          git commit -m "Log Instagram post $(date +'%Y-%m-%d')" || echo "Nothing to commit"
          git push

      - name: Note that Instagram posting is paused
        if: steps.check_time.outputs.should_run == 'true' && vars.IG_POSTING_PAUSED == 'true'
        run: echo "IG_POSTING_PAUSED is set to true in repo variables — skipping Instagram auto-post. Carousels were still generated and emailed to you."
