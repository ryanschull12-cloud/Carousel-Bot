name: Evening Instagram Post

# Posts one of today's remaining auto-post-winning carousels using content
# already generated and committed by the morning "Daily Carousels"
# workflow — no new content is generated here, this just spaces the last
# post out to roughly 8pm.
#
# This used to hard-code "--only-index 2", assuming carousel 2 was always
# one of the auto-posted picks. That assumption broke once runner.py
# started picking the 3 auto-post winners by virality score instead of by
# fixed position (winners can now be any 3 of the 5 carousels). This
# workflow no longer cares which index it is — it just asks
# instagram_post.py for "whichever winning carousel from today hasn't
# posted yet", which instagram_post.py itself tracks via posted_log.json.
# That also makes this workflow naturally safe to run more than once (or
# late) without ever double-posting: if there's nothing left to post
# today, it just does nothing.

on:
  schedule:
    # Runs every 15 minutes across a 7:00-10:45 PM GMT/UTC window instead of
    # a single 7pm shot, for the same reason as the other two workflows.
    # This one in particular was confirmed firing consistently ~3.5-4 hours
    # late (e.g. landing ~22:40 UTC against a ~19:02 UTC target) rather than
    # missing entirely, but a single shot per day still means one bad queue
    # moment away from a fully missed day. instagram_post.py's own dedupe
    # (posted_log.json / --target-count) makes every extra tick a
    # near-instant no-op once today's evening post has already gone out.
    - cron: "*/15 19-22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # needed so this workflow can commit posted_log.json

jobs:
  post-evening-carousel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post next Instagram carousel
        if: vars.IG_POSTING_PAUSED != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        # --target-count 1 (changed 2026-08-08, was 3): this is now the
        # ONLY slot that posts to Instagram, so it must post exactly one
        # carousel. Left at 3 it would have fired all three of today's
        # winners back to back 90s apart, which is worse than the
        # 3-posts-spread-out setup this change was meant to replace.
        # Old note follows:
        # --target-count 3: by the end of the evening slot, all 3 of
        # today's winners should be posted in total (1 morning + 1 midday
        # + 1 here). This also protects against GitHub firing BOTH the
        # 19:30 and 20:30 UTC triggers for this workflow on a given day --
        # the second firing sees 3 already posted and does nothing.
        run: python instagram_post.py --target-count 1

      - name: Commit posting log
        if: vars.IG_POSTING_PAUSED != 'true'
        run: |
          git config user.name "carousel-bot"
          git config user.email "actions@github.com"
          git add posted_log.json 2>/dev/null || true
          git commit -m "Log Instagram post $(date +'%Y-%m-%d %H:%M')" || echo "Nothing to commit"
          git push

      - name: Note that Instagram posting is paused
        if: vars.IG_POSTING_PAUSED == 'true'
        run: echo "IG_POSTING_PAUSED is set to true in repo variables — skipping Instagram auto-post."
