name: Evening Instagram Post

# Posts one of today's remaining auto-post-winning carousels using content
# already generated and committed by the morning "Daily Carousels"
# workflow — no new content is generated here, this just spaces the last
# post out to roughly 8pm.
#
# This used to hard-code "--only-index 2", assuming carousel 2 was always
# one of the auto-posted picks. That assumption broke once runner.py
# started picking the 3 auto-post winners by virality score instead of by
# fixed position (winners can now be any 3 of the 5 carousels). This
# workflow no longer cares which index it is — it just asks
# instagram_post.py for "whichever winning carousel from today hasn't
# posted yet", which instagram_post.py itself tracks via posted_log.json.
# That also makes this workflow naturally safe to run more than once (or
# late) without ever double-posting: if there's nothing left to post
# today, it just does nothing.

on:
  schedule:
    # Fires at both 19:30 and 20:30 UTC to loosely target 8pm Irish time
    # across BST/GMT. No time-of-day gate is needed anymore (see above) —
    # instagram_post.py's own dedupe makes it safe for both of these, or a
    # late-running retry of either, to fire without causing a duplicate.
    - cron: "30 19 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # needed so this workflow can commit posted_log.json

jobs:
  post-evening-carousel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post next Instagram carousel
        if: vars.IG_POSTING_PAUSED != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python instagram_post.py

      - name: Commit posting log
        if: vars.IG_POSTING_PAUSED != 'true'
        run: |
          git config user.name "carousel-bot"
          git config user.email "actions@github.com"
          git add posted_log.json 2>/dev/null || true
          git commit -m "Log Instagram post $(date +'%Y-%m-%d %H:%M')" || echo "Nothing to commit"
          git push

      - name: Note that Instagram posting is paused
        if: vars.IG_POSTING_PAUSED == 'true'
        run: echo "IG_POSTING_PAUSED is set to true in repo variables — skipping Instagram auto-post."
