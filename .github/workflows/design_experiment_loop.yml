name: Design & Copy Experiment Loop

on:
  schedule:
    - cron: "0 9 * * 4"   # Thursday, ~9am UTC -- offset from Monday's
                           # Weekly Self-Review Report so the two never
                           # collide or compete for the same day's attention
  workflow_dispatch: {}    # lets you trigger it manually to test right now

permissions:
  contents: write   # needed so the workflow can commit a promoted
                     # copy_rule / design_constant change, and experiments.json

jobs:
  experiment_loop:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Evaluate active experiment / research + start the next one
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python experiment_loop.py

      - name: Commit any promoted change + experiments.json
        run: |
          git config user.name "carousel-bot"
          git config user.email "actions@github.com"
          git add experiments.json 2>/dev/null || true
          git add content_brain_system_prompt.txt 2>/dev/null || true
          git add critic_system_prompt.txt 2>/dev/null || true
          git add carousel_engine.py 2>/dev/null || true
          git commit -m "Design/copy experiment loop update $(date +'%Y-%m-%d')" || echo "Nothing to commit"
          git push
